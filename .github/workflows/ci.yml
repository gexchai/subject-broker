name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS / Node.js 20
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run subject-bound demo
        run: npm run demo

      - name: Run finance/support conformance proof
        run: npm run --silent conformance

      - name: Run test suite
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
